# Local development infrastructure for MediVisit AI/ML Services
# All services run on your Mac via Docker — nothing touches Azure or cloud
#
# Usage:
#   docker compose up -d        (start all services in background)
#   docker compose ps           (check status)
#   docker compose down         (stop all services)
#   docker compose down -v      (stop + delete all data volumes)

services:

  # ── MongoDB ──────────────────────────────────────────────────────────
  # Document database for: vendor configs, raw payload metadata, extraction logs
  # Port 27017 — connect with: mongodb://admin:localdev@localhost:27017
  mongodb:
    image: mongo:7.0
    container_name: medivisit_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: localdev
      MONGO_INITDB_DATABASE: medivisit
    volumes:
      - mongodb_data:/data/db

  # ── Redis ────────────────────────────────────────────────────────────
  # In-memory cache for: extraction result caching, idempotency dedup
  # Port 6379 — connect with: redis://:localdev@localhost:6379
  redis:
    image: redis:7.2-alpine
    container_name: medivisit_redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass localdev
    volumes:
      - redis_data:/data

  # ── Kafka ────────────────────────────────────────────────────────────
  # Event bus for: async vendor result processing, domain-to-domain events
  # Port 9092 — connect with: localhost:9092
  # Using KRaft mode (no separate Zookeeper needed)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: medivisit_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data

  # MinIO skipped — using local filesystem for raw vendor files in PoC
  # In production: Azure Blob Storage or S3

volumes:
  mongodb_data:
  redis_data:
  kafka_data:
