[project]
name = "aa-challenge"
version = "0.1.0"
description = "MediVisit Patient Portal — AI/ML Services for Aspiring Architects Challenge"
authors = [{name = "Nitesh Jindal"}]
requires-python = ">=3.11"

dependencies = [
    # LLM interaction
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.2.0",
    "langchain-google-genai>=2.0.0",

    # Data validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # PDF reading
    "pdfplumber>=0.11.0",

    # PDF generation (for mock vendor reports)
    "fpdf2>=2.8.0",

    # Config and env
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",

    # Data handling
    "pandas>=2.2.0",

    # HTTP (for REST adapter simulation)
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
